# Mock af editorial og customer til lokal udvikling. Svarene ligger som JSON-filer ved siden af.
server {
    listen 80;
    root /usr/share/nginx/html;
    default_type application/json;

    location /editorial/ {
        if ($http_authorization != "Bearer mock") { return 401 '{"error":"forkert token"}'; }
        try_files $uri $uri.json =404;
    }
    location /customer/ {
        try_files $uri $uri.json =404;
    }
}
