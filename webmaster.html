<title>Webmaster prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: app shell — slim nav rail, then tree | canvas (palette, sections, JSON) | inspector */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --sunk:#e9edf1; --line:#d7dde4; --fg:#18212b; --muted:#5d6b7a;
  --accent:#1f6f8b; --accent-soft:#dcedf3; --ds:#7a4fb5; --ds-soft:#efe7f9; --danger:#b4383a;
  --sec-light:#e4ecf1; --sec-dark:#24323f; --sec-brand:#cfe5ee;
  --code-bg:#121a22; --code-fg:#d6e2ec; --code-key:#7cc4de; --code-str:#c8e29a; --code-num:#f2b880;
  --f-display:"Space Grotesk",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161c; --panel:#18212a; --sunk:#131b22; --line:#2a3642; --fg:#e3eaf0; --muted:#93a3b2;
  --accent:#5bb4d3; --accent-soft:#183644; --ds:#b592e6; --ds-soft:#2a2140; --danger:#ef7b7d;
  --sec-light:#1b2731; --sec-dark:#070b0f; --sec-brand:#163a48;
  --code-bg:#0b1015; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161c; --panel:#18212a; --sunk:#131b22; --line:#2a3642; --fg:#e3eaf0; --muted:#93a3b2;
  --accent:#5bb4d3; --accent-soft:#183644; --ds:#b592e6; --ds-soft:#2a2140; --danger:#ef7b7d;
  --sec-light:#1b2731; --sec-dark:#070b0f; --sec-brand:#163a48;
  --code-bg:#0b1015; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:190px 1fr;height:100%}
.nav{background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.brand{font-family:var(--f-display);font-weight:600;font-size:17px;padding:4px 8px 16px;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:2px;background:var(--accent);display:inline-block}
.nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:6px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--sunk);color:var(--fg)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.nav .site{margin-top:auto;font-size:12px;color:var(--muted);padding:8px 10px;border-top:1px solid var(--line)}

.view{min-width:0;height:100%;overflow:hidden}
.pages{display:grid;grid-template-columns:240px minmax(0,1fr) 300px;height:100%}
.col{min-width:0;overflow:auto;padding:16px}
.col+.col{border-left:1px solid var(--line)}
.tree-col,.insp-col{background:var(--panel)}
h2{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
h1{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0;text-wrap:balance}
.hint{font-size:12px;color:var(--muted);margin:12px 0 0}

/* tree */
.tree{list-style:none;margin:0;padding:0}
.tree ul{list-style:none;margin:0;padding-left:14px;border-left:1px dashed var(--line);margin-left:9px}
.node{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:1px solid transparent;background:none;padding:5px 8px;border-radius:6px;margin:1px 0}
.node:hover{background:var(--sunk)}
.node[aria-current="true"]{background:var(--accent-soft)}
.node .grip{color:var(--muted);opacity:.5;cursor:grab;font-size:12px}
.node[draggable="false"] .grip{visibility:hidden}
.node span.tx{display:flex;flex-direction:column;min-width:0}
.node b{font-weight:500}
.node small{font-family:var(--f-mono);font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node.drop-inside{border-color:var(--accent);background:var(--accent-soft)}
.tree-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 10px;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.primary:hover{opacity:.9;color:var(--panel)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:3px 6px}
.btn.ghost:hover{color:var(--fg)}
.btn.danger:hover{color:var(--danger);border-color:var(--danger)}

/* canvas */
.canvas-col{display:flex;flex-direction:column;gap:16px;background:var(--bg);padding-top:0}
.palette{position:sticky;top:0;z-index:5;margin:0 -16px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.palette .lbl{font-size:12px;color:var(--muted);font-weight:600;margin-right:4px}
.pal{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;font-size:13px;font-weight:500;cursor:grab;user-select:none;display:inline-flex;gap:6px;align-items:center}
.pal:hover{border-color:var(--accent);color:var(--accent)}
.pal.sec-pal{border-style:dashed;border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pal .g{opacity:.5;font-size:11px}
.palette .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.page-head .path{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.chip.ds{background:var(--ds-soft);color:var(--ds);border-color:transparent}
.chip.draft{background:var(--accent-soft);color:var(--accent);border-color:transparent}

.sections{display:flex;flex-direction:column;gap:12px;min-height:80px}
.sec{border:1px solid var(--line);border-radius:10px;background:var(--panel);min-width:0}
.sec[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.sec-h{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.handle{cursor:grab;color:var(--muted);padding:2px 6px;border-radius:4px;user-select:none;font-size:15px;line-height:1}
.handle:hover{background:var(--sunk);color:var(--fg)}
.sec-name{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
.sec-h .spacer{flex:1}
.layouts{display:flex;gap:4px;flex-wrap:wrap}
.lp{display:flex;gap:2px;width:34px;height:22px;padding:3px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.lp span{background:var(--line);border-radius:1px;display:block}
.lp:hover{border-color:var(--accent)}
.lp[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lp[aria-pressed="true"] span{background:var(--accent)}
.lp.big{width:52px;height:32px;padding:4px;gap:3px}
.sec-body{display:grid;gap:10px;padding:10px;border-radius:0 0 10px 10px}
.sec-body.bg-light{background:var(--sec-light)}
.sec-body.bg-dark{background:var(--sec-dark)}
.sec-body.bg-brand{background:var(--sec-brand)}
.sec-body.sp-none{padding:4px}.sec-body.sp-large{padding:22px 10px}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:72px;background:color-mix(in srgb,var(--bg) 60%,transparent)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.col-w{font-family:var(--f-mono);font-size:10px;color:var(--muted);align-self:flex-end;margin:-4px -2px -4px 0}
.el{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;cursor:grab;text-align:left;width:100%}
.el:hover{border-color:var(--accent)}
.el[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.el .g{color:var(--muted);opacity:.5;font-size:12px}
.el .t{font-weight:600;min-width:0}
.el .s{grid-column:2/-1;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.el .dsdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ds);margin-right:5px;vertical-align:1px}
.dragging{opacity:.35}
.empty{color:var(--muted);font-size:12px;text-align:center;margin:auto 0}
.blank{border:2px dashed var(--line);border-radius:12px;padding:40px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.blank b{font-family:var(--f-display);font-size:17px;color:var(--fg)}
.blank.over{border-color:var(--accent);background:var(--accent-soft)}
.add-sec{align-self:flex-start}
#ind{position:fixed;height:3px;border-radius:2px;background:var(--accent);pointer-events:none;z-index:50;display:none;box-shadow:0 0 0 2px var(--accent-soft)}

/* json */
.json{background:var(--code-bg);color:var(--code-fg);border-radius:10px;overflow:hidden;flex-shrink:0}
.json-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #ffffff14;font-size:12px;flex-wrap:wrap}
.json-h code{font-family:var(--f-mono);color:var(--code-key)}
.json-h button{background:none;border:1px solid #ffffff2a;color:var(--code-fg);border-radius:5px;padding:2px 8px;font-size:12px}
.json pre{margin:0;padding:12px;font-family:var(--f-mono);font-size:12px;line-height:1.55;overflow:auto;max-height:360px}
.k{color:var(--code-key)} .str{color:var(--code-str)} .num{color:var(--code-num)}

/* inspector */
.insp-h{display:flex;flex-direction:column;gap:4px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.insp-h .meta{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.fields{display:flex;flex-direction:column;gap:14px}
.field label{display:flex;justify-content:space-between;gap:8px;font-weight:500;margin-bottom:4px;font-size:13px}
.field label em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:400}
.field input[type=text],.field input[type=number],.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px}
.field textarea{min-height:90px;resize:vertical}
.field .help{font-size:12px;color:var(--muted);margin-top:4px}
.req{color:var(--danger)}
.ds-box{border:1px solid var(--ds);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:10px;background:var(--ds-soft)}
.ds-box .field input,.ds-box .field select{background:var(--panel)}
.ds-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ds);font-weight:600;flex-wrap:wrap}
.img-field{display:flex;gap:8px;align-items:center}
.img-thumb{width:44px;height:44px;border-radius:6px;flex-shrink:0;background:repeating-linear-gradient(45deg,var(--sunk) 0 6px,var(--line) 6px 12px)}
.check{display:flex;align-items:center;gap:8px}

/* other views */
.pad{padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px));overflow:auto;height:100%}
.pad>p{color:var(--muted);max-width:65ch;margin:6px 0 20px}
table{border-collapse:collapse;width:100%;background:var(--panel);border:1px solid var(--line)}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;background:var(--sunk)}
td input,td select{width:100%;border:1px solid transparent;background:none;border-radius:5px;padding:4px 6px;font-family:var(--f-mono);font-size:13px}
td input:hover,td input:focus,td select:hover{border-color:var(--line);background:var(--bg)}
.tbl-wrap{overflow-x:auto;max-width:900px}
.defs{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;max-width:1100px}
.def-list{display:flex;flex-direction:column;gap:4px}
.def-list h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 4px}
.def-list button{text-align:left;border:0;background:none;padding:6px 8px;border-radius:6px;font-family:var(--f-mono);font-size:13px}
.def-list button:hover{background:var(--sunk)}
.def-list button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.def-file{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-bottom:6px}

@media (max-width:1150px){.pages{grid-template-columns:210px minmax(0,1fr) 260px}}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .nav{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));overflow-x:auto;align-items:center}
  .brand{padding:0 8px 0 0}
  .nav .site{display:none}
  .pages{grid-template-columns:1fr;height:auto}
  .view{overflow:auto}
  .col{overflow:visible;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .col+.col{border-left:0;border-top:1px solid var(--line)}
  .sec-body{grid-template-columns:1fr!important}
  .palette{position:static}
  .defs{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <nav class="nav" aria-label="Hovedmenu">
    <div class="brand"><i></i>Webmaster</div>
    <button data-view="pages" aria-current="true">Sider</button>
    <button data-view="redirects">Redirects</button>
    <button data-view="defs">Definitioner</button>
    <div class="site">Site: <b>nyhedssite.dk</b><br>Prototype med eksempeldata</div>
  </nav>
  <main class="view" id="view"></main>
</div>
<div id="ind" aria-hidden="true"></div>

<script>
/* ================= Definitioner (udviklerne skriver dem i JSON) ================= */
const SECTIONS_EDITORIAL=["sport","indland","udland","kultur","erhverv"];
const LAYOUTS={
  "1":      {layout:"1",label:"1 kolonne",columns:[{width:12}]},
  "1-1":    {layout:"1-1",label:"2 kolonner",columns:[{width:6},{width:6}]},
  "2-1":    {layout:"2-1",label:"2/3 + 1/3",columns:[{width:8},{width:4}]},
  "1-2":    {layout:"1-2",label:"1/3 + 2/3",columns:[{width:4},{width:8}]},
  "1-1-1":  {layout:"1-1-1",label:"3 kolonner",columns:[{width:4},{width:4},{width:4}]},
  "1-1-1-1":{layout:"1-1-1-1",label:"4 kolonner",columns:[{width:3},{width:3},{width:3},{width:3}]}
};
const SECTION_DEF={type:"section",version:1,label:"Sektion",fields:[
  {key:"background",type:"select",label:"Baggrund",options:["none","light","dark","brand"],default:"none"},
  {key:"spacing",type:"select",label:"Luft",options:["none","small","medium","large"],default:"medium"},
  {key:"anchor",type:"text",label:"Anker-id",help:"Bruges til links som /side#anker"},
  {key:"fullWidth",type:"boolean",label:"Fuld bredde",default:false}]};
const PAGE_DEF={type:"page",fields:[
  {key:"title",type:"text",label:"Sidetitel",required:true},
  {key:"description",type:"text",label:"Meta-beskrivelse"},
  {key:"noindex",type:"boolean",label:"Skjul for søgemaskiner",default:false}]};
const ELEMENTS={
  hero:{type:"hero",version:1,label:"Hero",fields:[
    {key:"title",type:"text",label:"Overskrift",required:true},
    {key:"subtitle",type:"text",label:"Underrubrik"},
    {key:"image",type:"image",label:"Billede"},
    {key:"link",type:"link",label:"Link"}]},
  articleList:{type:"articleList",version:1,label:"Artikelliste",fields:[
    {key:"title",type:"text",label:"Overskrift",required:true},
    {key:"layout",type:"select",label:"Visning",options:["list","grid","carousel"],default:"list"},
    {key:"showImages",type:"boolean",label:"Vis billeder",default:true},
    {key:"articles",type:"datasource",label:"Artikler",source:"editorial",params:[
      {key:"section",type:"select",label:"Sektion",optionsFrom:"editorial:sections"},
      {key:"limit",type:"number",label:"Antal",default:10,max:50}]}]},
  text:{type:"text",version:1,label:"Tekst",fields:[
    {key:"body",type:"richtext",label:"Tekst",required:true}]},
  teaser:{type:"teaser",version:1,label:"Teaser",fields:[
    {key:"title",type:"text",label:"Titel",required:true},
    {key:"image",type:"image",label:"Billede"},
    {key:"link",type:"link",label:"Link",required:true}]},
  newsletter:{type:"newsletter",version:1,label:"Nyhedsbrev",fields:[
    {key:"title",type:"text",label:"Overskrift"},
    {key:"list",type:"select",label:"Liste",options:["morgen","sport","weekend"],default:"morgen"}]},
  userBox:{type:"userBox",version:1,label:"Brugerboks",fields:[
    {key:"greeting",type:"text",label:"Hilsen",default:"Hej {firstName}"},
    {key:"user",type:"datasource",label:"Bruger",source:"customer",params:[
      {key:"include",type:"select",label:"Inkludér",options:["profile","profile+subscriptions"],default:"profile"}]}]}
};

/* ================= Indhold (webmasteren laver det i editoren) ================= */
let uid=100; const nid=p=>p+"_"+(uid++).toString(36);
const el=(type,fields)=>({id:nid("el"),type,fields});
const ds=params=>({params});
const sec=(layout,settings,...columns)=>({id:nid("sec"),layout,settings:{background:"none",spacing:"medium",...settings},columns});
const state={
  view:"pages", selPage:"n_front", sel:null, defSel:"layout:2-1",
  tree:[
    {id:"n_front",parent:null,slug:"",title:"Forside"},
    {id:"n_news",parent:"n_front",slug:"nyheder",title:"Nyheder"},
    {id:"n_sport",parent:"n_news",slug:"sport",title:"Sport"},
    {id:"n_ind",parent:"n_news",slug:"indland",title:"Indland"},
    {id:"n_kultur",parent:"n_front",slug:"kultur",title:"Kultur"},
    {id:"n_om",parent:"n_front",slug:"om-os",title:"Om os"},
    {id:"n_kontakt",parent:"n_om",slug:"kontakt",title:"Kontakt"}],
  pages:{
    n_front:{fields:{title:"Forside",description:"Seneste nyt fra hele landet"},sections:[
      sec("1",{spacing:"small"},[el("hero",{title:"Valget 2026",subtitle:"Følg resultaterne live",image:"/img/valg.jpg",link:"/nyheder/indland/valg"})]),
      sec("2-1",{},
        [el("articleList",{title:"Seneste nyt",layout:"grid",showImages:true,articles:ds({section:"indland",limit:12})}),
         el("articleList",{title:"Sport",layout:"list",showImages:false,articles:ds({section:"sport",limit:5})})],
        [el("userBox",{greeting:"Hej {firstName}",user:ds({include:"profile"})}),el("newsletter",{title:"Få morgenbrevet",list:"morgen"})]),
      sec("1-1-1",{background:"light",anchor:"tema"},
        [el("teaser",{title:"Klima",link:"/tema/klima"})],[el("teaser",{title:"Bolig",link:"/tema/bolig"})],[el("teaser",{title:"Sundhed",link:"/tema/sundhed"})])]},
    n_news:{fields:{title:"Nyheder"},sections:[
      sec("2-1",{},[el("articleList",{title:"Alle nyheder",layout:"list",showImages:true,articles:ds({section:"indland",limit:20})})],[])]},
    n_sport:{fields:{title:"Sport",description:"Sportsnyheder"},sections:[
      sec("1",{background:"dark"},[el("hero",{title:"Superligaen",subtitle:"Runde 14",image:"/img/stadion.jpg",link:"/nyheder/sport/superliga"})]),
      sec("2-1",{},[el("articleList",{title:"Seneste sport",layout:"grid",showImages:true,articles:ds({section:"sport",limit:10})})],[el("newsletter",{title:"Sportsbrevet",list:"sport"})])]},
    n_ind:{fields:{title:"Indland"},sections:[]},
    n_kultur:{fields:{title:"Kultur"},sections:[sec("1",{},[el("articleList",{title:"Kultur",layout:"carousel",showImages:true,articles:ds({section:"kultur",limit:8})})])]},
    n_om:{fields:{title:"Om os"},sections:[sec("1",{},[el("text",{body:"Vi er en uafhængig nyhedsredaktion..."})])]},
    n_kontakt:{fields:{title:"Kontakt"},sections:[sec("1-1",{},[el("text",{body:"Skriv til redaktionen."})],[el("text",{body:"Ring på 70 20 30 40"})])]}},
  redirects:[
    {id:nid("r"),from:"/sporten",to:"/nyheder/sport",status:301},
    {id:nid("r"),from:"/om",to:"/om-os",status:301},
    {id:nid("r"),from:"/valg",to:"/nyheder/indland/valg",status:302}]
};

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const node=id=>state.tree.find(n=>n.id===id);
const kids=id=>state.tree.filter(n=>n.parent===id);
const page=()=>state.pages[state.selPage];
function pathOf(id){const parts=[];let n=node(id);while(n){if(n.slug)parts.unshift(n.slug);n=node(n.parent)}return "/"+parts.join("/")}
function isDesc(id,anc){let n=node(id);while(n){if(n.id===anc)return true;n=node(n.parent)}return false}
function findEl(id){for(const s of page().sections)for(let c=0;c<s.columns.length;c++){const i=s.columns[c].findIndex(e=>e.id===id);if(i>-1)return{sec:s,col:c,i,el:s.columns[c][i]}}return null}
const findSec=id=>page().sections.find(s=>s.id===id);
function defaultsFor(def){const f={};def.fields.forEach(fd=>{if(fd.type==="datasource"){const p={};fd.params.forEach(x=>{if(x.default!==undefined)p[x.key]=x.default});f[fd.key]={params:p}}else if(fd.default!==undefined)f[fd.key]=fd.default});return f}
function summary(e){const d=ELEMENTS[e.type];const parts=[];d.fields.forEach(fd=>{const v=e.fields[fd.key];if(fd.type==="datasource"&&v){parts.push(fd.source+": "+Object.values(v.params).join(", "))}else if(v!==undefined&&v!==""&&fd.type!=="image"&&typeof v!=="boolean")parts.push(String(v))});return parts.join(" · ")||"Ikke udfyldt"}
const hasDs=e=>ELEMENTS[e.type].fields.some(f=>f.type==="datasource");
function setLayout(s,key){const n=LAYOUTS[key].columns.length;const cols=s.columns;
  if(cols.length>n){const extra=cols.splice(n).flat();cols[n-1].push(...extra)}
  while(cols.length<n)cols.push([]);s.layout=key}
const layoutIcon=(key,big)=>`<button class="lp${big?" big":""}" data-layout="${key}" aria-label="${esc(LAYOUTS[key].label)}" title="${esc(LAYOUTS[key].label)}">${LAYOUTS[key].columns.map(c=>`<span style="flex:${c.width}"></span>`).join("")}</button>`;

function highlight(obj){
  return esc(JSON.stringify(obj,null,2))
    .replace(/(&quot;[^&]*?&quot;)(\s*:)/g,'<span class="k">$1</span>$2')
    .replace(/(:\s*)(&quot;.*?&quot;)/g,'$1<span class="str">$2</span>')
    .replace(/(\[\s*|,\s*\n\s*)(&quot;.*?&quot;)(?=\s*[,\]])/g,'$1<span class="str">$2</span>')
    .replace(/(:\s*)(-?\d+\.?\d*|true|false|null)/g,'$1<span class="num">$2</span>');
}
function elOut(e){const d=ELEMENTS[e.type];const fields={};
  d.fields.forEach(fd=>{const v=e.fields[fd.key];if(v===undefined||v==="")return;fields[fd.key]=fd.type==="datasource"?{source:fd.source,params:v.params}:v});
  return{id:e.id,type:e.type,version:d.version,fields}}
function apiOutput(id){const p=state.pages[id];
  return{path:pathOf(id),fields:p.fields,sections:p.sections.map(s=>({id:s.id,layout:s.layout,settings:s.settings,
    columns:LAYOUTS[s.layout].columns.map((c,i)=>({width:c.width,elements:(s.columns[i]||[]).map(elOut)}))}))}}

/* ================= feltrenderere (én pr. felttype) ================= */
function renderField(fd,value,path){
  const id="f_"+path.join("_");
  const lab=`<label for="${id}">${esc(fd.label||fd.key)}${fd.required?' <span class="req">*</span>':""}<em>${fd.type}</em></label>`;
  const dp=`data-path="${esc(path.join("."))}"`;
  const help=fd.help?`<div class="help">${esc(fd.help)}</div>`:"";
  switch(fd.type){
    case "text": return `<div class="field">${lab}<input type="text" id="${id}" ${dp} value="${esc(value)}">${help}</div>`;
    case "link": return `<div class="field">${lab}<input type="text" id="${id}" ${dp} value="${esc(value)}" placeholder="/sti eller https://"><div class="help">Intern sti eller ekstern URL</div></div>`;
    case "richtext": return `<div class="field">${lab}<textarea id="${id}" ${dp}>${esc(value)}</textarea></div>`;
    case "number": return `<div class="field">${lab}<input type="number" id="${id}" ${dp} data-num value="${esc(value)}"${fd.max?` max="${fd.max}"`:""} min="1"></div>`;
    case "boolean": return `<div class="field"><div class="check"><input type="checkbox" id="${id}" ${dp} data-bool ${value?"checked":""}><label for="${id}" style="margin:0">${esc(fd.label)}</label></div></div>`;
    case "image": return `<div class="field">${lab}<div class="img-field"><div class="img-thumb" aria-hidden="true"></div><input type="text" id="${id}" ${dp} value="${esc(value)}" placeholder="Vælg fra mediearkiv"></div></div>`;
    case "select":{
      const opts=fd.optionsFrom?SECTIONS_EDITORIAL:fd.options;
      const h=fd.optionsFrom?`<div class="help">Valgmuligheder hentes fra <code>${esc(fd.optionsFrom)}</code></div>`:help;
      return `<div class="field">${lab}<select id="${id}" ${dp}><option value="">Vælg…</option>${opts.map(o=>`<option ${o===value?"selected":""}>${esc(o)}</option>`).join("")}</select>${h}</div>`}
    case "datasource":{
      const v=value||{params:{}};
      return `<div class="field"><label>${esc(fd.label)}<em>datasource</em></label><div class="ds-box">
        <div class="ds-head"><span>Kilde: ${esc(fd.source)}</span><span class="chip ds">resolves af sitet</span></div>
        ${fd.params.map(p=>renderField(p,v.params[p.key],[...path,"params",p.key])).join("")}</div></div>`}
  }
  return "";
}

/* ================= views ================= */
function render(){
  document.querySelectorAll(".nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.view===state.view));
  if(state.view==="pages")renderPages();else if(state.view==="redirects")renderRedirects();else renderDefs();
}
function renderPages(){
  $("#view").innerHTML=`<div class="pages">
    <section class="col tree-col" aria-label="Sidetræ"><h2>Sidetræ</h2><div id="tree"></div>
      <div class="tree-actions"><button class="btn" id="addChild">+ Underside</button><button class="btn danger" id="delPage">Slet</button></div>
      <p class="hint">Træk sider for at flytte dem. Slip på midten af en side for at gøre den til underside.</p></section>
    <section class="col canvas-col" id="canvas" aria-label="Side"></section>
    <section class="col insp-col" id="insp" aria-label="Egenskaber"></section></div>`;
  renderTree();renderCanvas();renderInspector();
  $("#addChild").onclick=()=>{const n={id:nid("n"),parent:state.selPage,slug:"ny-side-"+uid,title:"Ny side"};
    state.tree.push(n);state.pages[n.id]={fields:{title:"Ny side"},sections:[]};state.selPage=n.id;state.sel=null;renderPages()};
  $("#delPage").disabled=state.selPage==="n_front";
  $("#delPage").onclick=()=>{const rm=id=>{kids(id).forEach(k=>rm(k.id));state.tree=state.tree.filter(n=>n.id!==id);delete state.pages[id]};
    const parent=node(state.selPage).parent;rm(state.selPage);state.selPage=parent;state.sel=null;renderPages()};
}
function renderTree(){
  const walk=id=>{const n=node(id);const c=kids(id);
    return `<li><button class="node" data-node="${n.id}" draggable="${n.id!=="n_front"}" aria-current="${n.id===state.selPage}"><span class="grip" aria-hidden="true">⠿</span><span class="tx"><b>${esc(n.title)}</b><small>${esc(pathOf(n.id))}</small></span></button>${c.length?`<ul>${c.map(k=>walk(k.id)).join("")}</ul>`:""}</li>`};
  $("#tree").innerHTML=`<ul class="tree">${walk("n_front")}</ul>`;
  $("#tree").onclick=e=>{const b=e.target.closest("[data-node]");if(!b)return;state.selPage=b.dataset.node;state.sel=null;renderPages()};
}
function secHtml(s,i){
  const L=LAYOUTS[s.layout];const st=s.settings;
  return `<section class="sec" data-sec="${s.id}" aria-current="${state.sel?.kind==="sec"&&state.sel.id===s.id}">
    <div class="sec-h">
      <span class="handle" draggable="true" data-drag-sec="${s.id}" title="Træk for at flytte sektionen" aria-label="Flyt sektion">⠿</span>
      <span class="sec-name" data-sel-sec="${s.id}">Sektion ${i+1}${st.anchor?` · #${esc(st.anchor)}`:""}</span>
      <div class="layouts" data-sec-layouts="${s.id}">${Object.keys(LAYOUTS).map(k=>layoutIcon(k).replace('class="lp"',`class="lp" aria-pressed="${k===s.layout}"`)).join("")}</div>
      <span class="spacer"></span>
      <button class="btn ghost" data-sel-sec="${s.id}">Indstillinger</button>
      <button class="btn ghost" data-del-sec="${s.id}" aria-label="Slet sektion">✕</button>
    </div>
    <div class="sec-body bg-${esc(st.background)} sp-${esc(st.spacing)}" style="grid-template-columns:${L.columns.map(c=>`minmax(0,${c.width}fr)`).join(" ")}">
      ${L.columns.map((c,ci)=>{const list=s.columns[ci]||[];
        return `<div class="drop" data-sec="${s.id}" data-col="${ci}"><span class="col-w">${c.width}/12</span>
          ${list.map(e=>`<div class="el" draggable="true" data-el="${e.id}" role="button" tabindex="0" aria-current="${state.sel?.kind==="el"&&state.sel.id===e.id}">
            <span class="g" aria-hidden="true">⠿</span><span class="t">${hasDs(e)?'<span class="dsdot" title="Har datasource"></span>':""}${esc(ELEMENTS[e.type].label)}</span>
            <button class="btn ghost" data-del-el="${e.id}" aria-label="Fjern element">✕</button>
            <span class="s">${esc(summary(e))}</span></div>`).join("")}
          ${list.length?"":`<div class="empty">Træk et element hertil</div>`}</div>`}).join("")}
    </div></section>`;
}
function renderCanvas(){
  const p=page();const n=node(state.selPage);
  $("#canvas").innerHTML=`
    <div class="palette" aria-label="Byggeklodser">
      <span class="lbl">Træk ind</span>
      <span class="pal sec-pal" draggable="true" data-new-sec role="button" tabindex="0" title="Træk ind på siden, eller klik for at tilføje nederst"><span class="g">⠿</span>Sektion</span>
      <span class="sep"></span>
      ${Object.values(ELEMENTS).map(d=>`<span class="pal" draggable="true" data-new-el="${d.type}" role="button" tabindex="0" title="Træk ind i en kolonne, eller klik for at tilføje i den valgte"><span class="g">⠿</span>${esc(d.label)}</span>`).join("")}
    </div>
    <div class="page-head"><div><h1>${esc(p.fields.title||n.title)}</h1><div class="path">${esc(pathOf(state.selPage))}</div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="chip">${p.sections.length} sektioner</span><span class="chip draft">Kladde</span><button class="btn primary">Publicér</button></div></div>
    <div class="sections" id="sections">
      ${p.sections.length?p.sections.map(secHtml).join(""):`<div class="blank" id="blank"><b>Siden er tom</b><span>Træk en sektion hertil, eller vælg et layout for at starte.</span><div class="layouts" data-blank-layouts>${Object.keys(LAYOUTS).map(k=>layoutIcon(k,true)).join("")}</div></div>`}
    </div>
    ${p.sections.length?`<div class="add-sec"><span class="hint" style="margin-right:8px">Ny sektion:</span><span class="layouts" data-blank-layouts style="display:inline-flex">${Object.keys(LAYOUTS).map(k=>layoutIcon(k)).join("")}</span></div>`:""}
    <div class="json"><div class="json-h"><span>API-svar · <code>GET /api/pages?path=${esc(pathOf(state.selPage))}</code></span><button id="copyJson">Kopiér</button></div><pre id="jsonOut"></pre></div>`;
  updateJson();
  const c=$("#canvas");
  c.onclick=e=>{
    const t=e.target;
    const bl=t.closest("[data-blank-layouts] [data-layout]");
    if(bl){const s=sec(bl.dataset.layout,{},...LAYOUTS[bl.dataset.layout].columns.map(()=>[]));p.sections.push(s);state.sel={kind:"sec",id:s.id};refresh();return}
    const sl=t.closest("[data-sec-layouts] [data-layout]");
    if(sl){setLayout(findSec(sl.closest("[data-sec-layouts]").dataset.secLayouts),sl.dataset.layout);refresh();return}
    const ds_=t.closest("[data-del-sec]");if(ds_){p.sections=p.sections.filter(s=>s.id!==ds_.dataset.delSec);state.sel=null;refresh();return}
    const de=t.closest("[data-del-el]");if(de){const f=findEl(de.dataset.delEl);f.sec.columns[f.col].splice(f.i,1);if(state.sel?.id===de.dataset.delEl)state.sel=null;refresh();return}
    const ss=t.closest("[data-sel-sec]");if(ss){state.sel={kind:"sec",id:ss.dataset.selSec};refresh();return}
    const ce=t.closest("[data-el]");if(ce){state.sel={kind:"el",id:ce.dataset.el};refresh();return}
    const sb=t.closest("section.sec");if(sb){state.sel={kind:"sec",id:sb.dataset.sec};refresh();return}
    if(t.closest("[data-new-sec]")){const s=sec("1",{},[]);p.sections.push(s);state.sel={kind:"sec",id:s.id};refresh();return}
    const ne=t.closest("[data-new-el]");if(ne){addByClick(ne.dataset.newEl);return}
    if(t.id==="copyJson"){navigator.clipboard?.writeText(JSON.stringify(apiOutput(state.selPage),null,2)).then(()=>t.textContent="Kopieret",()=>{})}
  };
  c.onkeydown=e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-el],[data-new-el],[data-new-sec]")){e.preventDefault();e.target.click()}};
}
/* Klik-alternativ til træk (fx på touch): læg elementet i den valgte kolonne */
function addByClick(type){
  const p=page();const item=el(type,defaultsFor(ELEMENTS[type]));
  if(state.sel?.kind==="el"){const f=findEl(state.sel.id);f.sec.columns[f.col].splice(f.i+1,0,item)}
  else{let s=state.sel?.kind==="sec"?findSec(state.sel.id):p.sections.at(-1);if(!s){s=sec("1",{},[]);p.sections.push(s)}s.columns[0].push(item)}
  state.sel={kind:"el",id:item.id};refresh();
}
function refresh(){renderCanvas();renderInspector()}
function updateJson(){const o=$("#jsonOut");if(o)o.innerHTML=highlight(apiOutput(state.selPage))}

function renderInspector(){
  const p=page();const n=node(state.selPage);const insp=$("#insp");const sel=state.sel;
  const back=`<div style="margin-top:16px"><button class="btn ghost" id="backPage">← Sidens egenskaber</button></div>`;
  if(sel?.kind==="el"&&findEl(sel.id)){const f=findEl(sel.id);const d=ELEMENTS[f.el.type];const si=p.sections.indexOf(f.sec)+1;
    insp.innerHTML=`<div class="insp-h"><h2 style="margin:0">Element</h2><h1 style="font-size:18px">${esc(d.label)}</h1><div class="meta">${esc(d.type)} v${d.version} · sektion ${si}, kolonne ${f.col+1}</div></div>
      <div class="fields" data-target="el">${d.fields.map(fd=>renderField(fd,f.el.fields[fd.key],[fd.key])).join("")}</div>${back}`;
  }else if(sel?.kind==="sec"&&findSec(sel.id)){const s=findSec(sel.id);
    insp.innerHTML=`<div class="insp-h"><h2 style="margin:0">Sektion</h2><h1 style="font-size:18px">Sektion ${p.sections.indexOf(s)+1}</h1><div class="meta">${esc(s.id)}</div></div>
      <div class="fields"><div class="field"><label>Layout<em>${esc(s.layout)}</em></label><div class="layouts" id="inspLayouts">${Object.keys(LAYOUTS).map(k=>layoutIcon(k,true).replace('class="lp big"',`class="lp big" aria-pressed="${k===s.layout}"`)).join("")}</div>
        <div class="help">Skifter du til færre kolonner, flyttes elementerne over i den sidste kolonne.</div></div>
      <div class="fields" data-target="sec">${SECTION_DEF.fields.map(fd=>renderField(fd,s.settings[fd.key],[fd.key])).join("")}</div></div>${back}`;
    $("#inspLayouts").onclick=e=>{const b=e.target.closest("[data-layout]");if(b){setLayout(s,b.dataset.layout);refresh()}};
  }else{state.sel=null;
    insp.innerHTML=`<div class="insp-h"><h2 style="margin:0">Side</h2><h1 style="font-size:18px">${esc(n.title)}</h1><div class="meta">${esc(n.id)}</div></div>
      <div class="fields">
        <div class="field"><label for="f_navtitle">Navn i træet</label><input type="text" id="f_navtitle" value="${esc(n.title)}"></div>
        <div class="field"><label for="f_slug">Slug<em>${esc(pathOf(n.id))}</em></label><input type="text" id="f_slug" value="${esc(n.slug)}" ${n.id==="n_front"?"disabled":""}></div>
        <div class="fields" data-target="page">${PAGE_DEF.fields.map(fd=>renderField(fd,p.fields[fd.key],[fd.key])).join("")}</div>
      </div><p class="hint">Vælg en sektion eller et element i midten for at redigere det.</p>`;
    $("#f_navtitle").oninput=e=>{n.title=e.target.value;renderTree()};
    $("#f_slug").oninput=e=>{n.slug=e.target.value.toLowerCase().replace(/[^a-z0-9-]/g,"-");renderTree();updateJson();$("#canvas .path").textContent=pathOf(n.id)};
  }
  const bp=$("#backPage");if(bp)bp.onclick=()=>{state.sel=null;refresh()};
  insp.oninput=insp.onchange=e=>{const t=e.target;if(!t.dataset.path)return;
    const target=t.closest("[data-target]").dataset.target;
    const obj=target==="el"?findEl(state.sel.id).el.fields:target==="sec"?findSec(state.sel.id).settings:p.fields;
    const v=t.dataset.bool!==undefined?t.checked:t.dataset.num!==undefined?(t.value===""?"":+t.value):t.value;
    const keys=t.dataset.path.split(".");let o=obj;
    for(let i=0;i<keys.length-1;i++){o[keys[i]]=o[keys[i]]||{};o=o[keys[i]]}
    o[keys.at(-1)]=v;
    if(target==="el"){const card=document.querySelector(`[data-el="${state.sel.id}"] .s`);if(card)card.textContent=summary(findEl(state.sel.id).el);updateJson()}
    else if(target==="sec"){if(e.type==="change"||t.type==="text"){renderCanvas()}}
    else{if(keys[0]==="title")$("#canvas h1").textContent=v;updateJson()}};
}

/* ================= drag & drop ================= */
let drag=null, target=null;
const ind=$("#ind");
function clearInd(){ind.style.display="none";target=null;document.querySelectorAll(".over,.drop-inside").forEach(x=>x.classList.remove("over","drop-inside"))}
function showLine(left,width,y){ind.style.display="block";ind.style.left=left+"px";ind.style.width=width+"px";ind.style.top=(y-1)+"px"}
/* find indsætningsplads ud fra musens y blandt søskende (det trukne element tæller ikke med) */
function slot(items,y,box){
  let idx=items.length;
  for(let i=0;i<items.length;i++){const r=items[i].getBoundingClientRect();if(y<r.top+r.height/2){idx=i;break}}
  let ly;
  if(!items.length)ly=box.top+box.height/2;
  else if(idx<items.length)ly=items[idx].getBoundingClientRect().top-5;
  else ly=items[items.length-1].getBoundingClientRect().bottom+5;
  return{idx,ly};
}
document.addEventListener("dragstart",e=>{
  const t=e.target.closest&&e.target.closest('[draggable="true"]');if(!t)return;
  if(t.dataset.el)drag={kind:"el",id:t.dataset.el};
  else if(t.dataset.newEl)drag={kind:"newEl",type:t.dataset.newEl};
  else if(t.dataset.dragSec){drag={kind:"sec",id:t.dataset.dragSec};const s=t.closest(".sec");try{e.dataTransfer.setDragImage(s,24,16)}catch(_){}}
  else if(t.dataset.newSec!==undefined)drag={kind:"newSec"};
  else if(t.dataset.node)drag={kind:"node",id:t.dataset.node};
  else return;
  e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",drag.kind);
  const fade=drag.kind==="sec"?t.closest(".sec"):t;
  requestAnimationFrame(()=>fade.classList.add("dragging"));
});
document.addEventListener("dragend",()=>{drag=null;clearInd();document.querySelectorAll(".dragging").forEach(x=>x.classList.remove("dragging"))});
document.addEventListener("dragover",e=>{
  if(!drag)return;
  if(drag.kind==="el"||drag.kind==="newEl"){
    const col=e.target.closest(".drop");clearInd();if(!col)return;e.preventDefault();
    const items=[...col.querySelectorAll(":scope>.el")].filter(x=>x.dataset.el!==drag.id);
    const box=col.getBoundingClientRect();const {idx,ly}=slot(items,e.clientY,box);
    col.classList.add("over");showLine(box.left+8,box.width-16,ly);
    target={kind:"col",sec:col.dataset.sec,col:+col.dataset.col,idx};
  }else if(drag.kind==="sec"||drag.kind==="newSec"){
    const area=e.target.closest(".canvas-col");clearInd();if(!area)return;e.preventDefault();
    const wrap=$("#sections");const blank=$("#blank");
    if(blank){blank.classList.add("over");target={kind:"sec",idx:0};return}
    const items=[...wrap.querySelectorAll(":scope>.sec")].filter(x=>x.dataset.sec!==drag.id);
    const box=wrap.getBoundingClientRect();const {idx,ly}=slot(items,e.clientY,box);
    showLine(box.left,box.width,ly);target={kind:"sec",idx};
  }else if(drag.kind==="node"){
    const nb=e.target.closest(".node[data-node]");clearInd();if(!nb)return;
    const tid=nb.dataset.node;if(tid===drag.id||isDesc(tid,drag.id))return;
    e.preventDefault();
    const r=nb.getBoundingClientRect();const rel=(e.clientY-r.top)/r.height;
    let pos=tid==="n_front"?"inside":rel<.28?"before":rel>.72?"after":"inside";
    if(pos==="inside")nb.classList.add("drop-inside");else showLine(r.left,r.width,pos==="before"?r.top-1:r.bottom+1);
    target={kind:"node",id:tid,pos};
  }
});
document.addEventListener("drop",e=>{
  if(!drag||!target){clearInd();return}e.preventDefault();
  const p=page();
  if(target.kind==="col"){
    let item;
    if(drag.kind==="el"){const f=findEl(drag.id);item=f.el;f.sec.columns[f.col].splice(f.i,1)}
    else item=el(drag.type,defaultsFor(ELEMENTS[drag.type]));
    findSec(target.sec).columns[target.col].splice(target.idx,0,item);
    state.sel={kind:"el",id:item.id};drag=null;clearInd();refresh();
  }else if(target.kind==="sec"){
    let s;
    if(drag.kind==="sec"){s=findSec(drag.id);p.sections=p.sections.filter(x=>x!==s)}
    else s=sec("1",{},[]);
    p.sections.splice(target.idx,0,s);state.sel={kind:"sec",id:s.id};drag=null;clearInd();refresh();
  }else if(target.kind==="node"){
    const n=node(drag.id);const t=node(target.id);
    state.tree=state.tree.filter(x=>x!==n);
    if(target.pos==="inside"){n.parent=t.id;state.tree.push(n)}
    else{n.parent=t.parent;const i=state.tree.indexOf(t);state.tree.splice(target.pos==="before"?i:i+1,0,n)}
    drag=null;clearInd();renderTree();updateJson();const ph=$("#canvas .path");if(ph)ph.textContent=pathOf(state.selPage);
  }
});

/* ================= redirects & definitioner ================= */
function renderRedirects(){
  $("#view").innerHTML=`<div class="pad"><h1>Redirects</h1><p>Sitet slår stien op her, før det leder efter en side i træet. 301 er permanent, 302 er midlertidig.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Fra</th><th>Til</th><th style="width:110px">Status</th><th style="width:50px"></th></tr></thead><tbody>
    ${state.redirects.map(r=>`<tr data-r="${r.id}"><td><input aria-label="Fra" data-k="from" value="${esc(r.from)}"></td><td><input aria-label="Til" data-k="to" value="${esc(r.to)}"></td>
      <td><select aria-label="Status" data-k="status">${[301,302,307,308].map(s=>`<option ${s===r.status?"selected":""}>${s}</option>`).join("")}</select></td>
      <td><button class="btn ghost" data-rdel="${r.id}" aria-label="Slet">✕</button></td></tr>`).join("")}
    </tbody></table></div><div style="margin-top:12px"><button class="btn" id="addR">+ Ny redirect</button></div>
    <div class="json" style="margin-top:24px;max-width:900px"><div class="json-h"><span>API-svar · <code>GET /api/redirects</code></span></div><pre id="rJson"></pre></div></div>`;
  const upd=()=>$("#rJson").innerHTML=highlight(state.redirects.map(({from,to,status})=>({from,to,status})));upd();
  $("#view").oninput=$("#view").onchange=e=>{const tr=e.target.closest("[data-r]");if(!tr)return;const r=state.redirects.find(x=>x.id===tr.dataset.r);const k=e.target.dataset.k;r[k]=k==="status"?+e.target.value:e.target.value;upd()};
  $("#view").onclick=e=>{if(e.target.id==="addR"){state.redirects.push({id:nid("r"),from:"/",to:"/",status:301});renderRedirects()}
    const d=e.target.closest("[data-rdel]");if(d){state.redirects=state.redirects.filter(x=>x.id!==d.dataset.rdel);renderRedirects()}};
}
function renderDefs(){
  const [kind,key]=state.defSel.split(":");
  const obj=kind==="element"?ELEMENTS[key]:kind==="layout"?LAYOUTS[key]:kind==="section"?SECTION_DEF:PAGE_DEF;
  const file=kind==="element"?`definitions/elements/${key}.json`:kind==="layout"?`definitions/layouts/${key}.json`:`definitions/${kind}.json`;
  const btn=(id,label)=>`<button data-def="${id}" aria-current="${state.defSel===id}">${label}</button>`;
  $("#view").innerHTML=`<div class="pad"><h1>Definitioner</h1><p>Udviklerne skriver layouts, sektioner og elementtyper som JSON-filer i et delt repo. Her kan de kun læses. Editoren laver sine formularfelter ud fra dem.</p>
    <div class="defs"><div class="def-list">
      <h3>Side og sektion</h3>${btn("page:page","page")}${btn("section:section","section")}
      <h3>Layouts</h3>${Object.keys(LAYOUTS).map(k=>btn("layout:"+k,k)).join("")}
      <h3>Elementtyper</h3>${Object.keys(ELEMENTS).map(k=>btn("element:"+k,k)).join("")}
      <h3>Felttyper</h3><div style="font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:0 8px;line-height:1.8">text · richtext · number<br>boolean · select · image<br>link · <span style="color:var(--ds)">datasource</span></div></div>
    <div style="min-width:0"><div class="def-file">${file}</div><div class="json"><pre style="max-height:none">${highlight(obj)}</pre></div></div></div></div>`;
  $("#view").onclick=e=>{const b=e.target.closest("[data-def]");if(b){state.defSel=b.dataset.def;renderDefs()}};
}
document.querySelector(".nav").onclick=e=>{const b=e.target.closest("[data-view]");if(!b)return;state.view=b.dataset.view;$("#view").oninput=$("#view").onchange=$("#view").onclick=null;render()};
render();
</script>
