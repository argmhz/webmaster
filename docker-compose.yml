services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webmaster
      POSTGRES_PASSWORD: webmaster
      POSTGRES_DB: webmaster
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webmaster -d webmaster"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Rust-API + færdigbygget editor på http://localhost:8088
  app:
    build: .
    environment:
      DATABASE_URL: postgres://webmaster:webmaster@db:5432/webmaster
      RUST_LOG: info,tower_http=info
      # Services til optionsFrom (se definitions/services.json). Lokalt peger de på mock.
      # Fjern en variabel, eller stop mock, for at se editoren bruge reservelisterne.
      EDITORIAL_URL: http://mock/editorial
      EDITORIAL_TOKEN: mock
      CUSTOMER_URL: http://mock/customer
    volumes:
      # Definitionerne læses ved hvert kald, så ændringer slår igennem uden rebuild
      - ./definitions:/app/definitions:ro
    ports:
      - "8088:8080"
    depends_on:
      db:
        condition: service_healthy

  # Mock af editorial og customer på http://localhost:8090. Appen afhænger ikke af den.
  mock:
    image: nginx:1.27-alpine
    volumes:
      - ./mock:/usr/share/nginx/html:ro
      - ./mock/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"

  # Valgfri: editor med hot reload på http://localhost:5173
  #   docker compose --profile dev up
  editor-dev:
    profiles: ["dev"]
    image: node:22-bookworm-slim
    working_dir: /editor
    command: sh -c "npm install && npm run dev"
    environment:
      API_URL: http://app:8080
    volumes:
      - ./editor:/editor
      - editor_node_modules:/editor/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - app

volumes:
  pgdata:
  editor_node_modules:
